name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Install MSRV Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.85.0

      - name: Check formatting
        run: cargo +stable fmt --all -- --check

      - name: Lint Rust
        run: cargo +stable clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test Rust
        run: cargo +stable test --workspace --all-targets --all-features

      - name: Check MSRV
        run: cargo +1.85.0 check --workspace --all-targets --all-features

      - name: Check Rust documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --workspace --all-features --no-deps

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install VS Code extension dependencies
        run: npm --prefix editors/vscode ci

      - name: Test VS Code extension
        run: npm --prefix editors/vscode test

      - name: Test native VS Code selection end to end
        run: |
          cargo +stable build -p gus-broker --bin gus-broker --bin gus-provider-bridge
          cargo +stable build -p gus-shim --bin gus-git-shim
          npm --prefix editors/vscode run test:native-e2e

  vscode-vsix:
    name: VS Code VSIX (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Build native provider runtime
        run: cargo build --release -p gus-broker --bin gus-provider-bridge --bin gus-broker

      - name: Install extension dependencies
        run: npm --prefix editors/vscode ci

      - name: Stage native provider runtime
        run: |
          mkdir -p editors/vscode/bin
          cp target/release/gus-provider-bridge editors/vscode/bin/gus-provider-bridge
          cp target/release/gus-broker editors/vscode/bin/gus-broker

      - name: Build target-specific VSIX
        run: npm --prefix editors/vscode run package:vsix -- --target ${{ matrix.target }} --out "${{ runner.temp }}/gus-${{ matrix.target }}.vsix"

      - name: Verify packaged native runtime
        shell: bash
        run: |
          python3 - "${{ runner.temp }}/gus-${{ matrix.target }}.vsix" <<'PY'
          import stat
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as archive:
              for name in (
                  "extension/bin/gus-broker",
                  "extension/bin/gus-provider-bridge",
                  "extension/dist/src/extension.js",
                  "extension/package.json",
              ):
                  info = archive.getinfo(name)
                  if name.startswith("extension/bin/"):
                      mode = info.external_attr >> 16
                      if not stat.S_ISREG(mode) or mode & 0o111 == 0:
                          raise SystemExit(f"{name} is not a packaged executable")
          PY

  native-platform:
    name: Native platform (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          components: clippy

      - name: Install MSRV Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.85.0

      - name: Lint workspace on native host
        run: cargo +stable clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test workspace on native host
        run: cargo +stable test --workspace --all-targets --all-features

      - name: Check workspace MSRV on native host
        run: cargo +1.85.0 check --workspace --all-targets --all-features

      - name: Check documentation on native host
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --workspace --all-features --no-deps

  windows-standard-user:
    name: Windows standard-user resolver
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable

      - name: Build resolver test binary
        shell: pwsh
        run: cargo +stable test -p gus-platform --lib --no-run

      - name: Run resolver as a non-Administrator
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $userName = "gusci"
          $plainPassword = "Gus-CI-$env:GITHUB_RUN_ID-Aa1!"
          $securePassword = ConvertTo-SecureString $plainPassword -AsPlainText -Force
          $credential = [pscredential]::new(".\$userName", $securePassword)
          $probeRoot = "C:\gus-standard-$env:GITHUB_RUN_ID"
          try {
            New-LocalUser -Name $userName -Password $securePassword -PasswordNeverExpires | Out-Null
            New-Item -ItemType Directory -Path $probeRoot -Force | Out-Null
            & icacls.exe $probeRoot /inheritance:r | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "failed to isolate the standard-user probe ACL"
            }
            & icacls.exe $probeRoot /grant:r `
              "${env:COMPUTERNAME}\${userName}:(OI)(CI)F" `
              "*S-1-5-18:(OI)(CI)F" `
              "*S-1-5-32-544:(OI)(CI)F" | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "failed to grant the standard-user probe ACL"
            }

            $testBinary = Get-ChildItem "target\debug\deps\gus_platform-*.exe" |
              Sort-Object LastWriteTimeUtc -Descending |
              Select-Object -First 1
            if ($null -eq $testBinary) {
              throw "gus-platform test binary was not produced"
            }
            $copiedBinary = Join-Path $probeRoot "gus-platform-tests.exe"
            Copy-Item $testBinary.FullName $copiedBinary
            & icacls.exe $probeRoot /setowner "${env:COMPUTERNAME}\${userName}" | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "failed to assign the standard-user probe directory"
            }
            $stdout = Join-Path $probeRoot "stdout.txt"
            $stderr = Join-Path $probeRoot "stderr.txt"
            $arguments = "--exact real_git::resolver_windows::tests::native_standard_user_resolver_probe --nocapture --test-threads=1"
            $process = Start-Process `
              -FilePath $copiedBinary `
              -ArgumentList $arguments `
              -Credential $credential `
              -LoadUserProfile `
              -Environment @{
                GUS_WINDOWS_STANDARD_USER_TEST = "1"
                TEMP = $probeRoot
                TMP = $probeRoot
              } `
              -RedirectStandardOutput $stdout `
              -RedirectStandardError $stderr `
              -Wait `
              -PassThru
            Get-Content $stdout
            Get-Content $stderr
            if ($process.ExitCode -ne 0) {
              throw "standard-user resolver probe failed with exit code $($process.ExitCode)"
            }
          } finally {
            Remove-LocalUser -Name $userName -ErrorAction SilentlyContinue
          }

  freebsd-cross:
    name: FreeBSD ABI ${{ matrix.abi }} cross-check
    strategy:
      fail-fast: false
      matrix:
        abi:
          - "12"
          - "14"
          - "15"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUST_LIBC_UNSTABLE_FREEBSD_VERSION: ${{ matrix.abi }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          components: clippy
          targets: x86_64-unknown-freebsd

      - name: Install MSRV Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.85.0
          targets: x86_64-unknown-freebsd

      - name: Lint FreeBSD target
        run: cargo +stable clippy --target x86_64-unknown-freebsd -p gus-broker -p gus-platform -p gus-shim --all-targets --all-features -- -D warnings

      - name: Check FreeBSD target MSRV
        run: cargo +1.85.0 check --target x86_64-unknown-freebsd -p gus-broker -p gus-platform -p gus-shim --all-targets --all-features
