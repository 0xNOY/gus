name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Install MSRV Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.85.0

      - name: Check formatting
        run: cargo +stable fmt --all -- --check

      - name: Lint Rust
        run: cargo +stable clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test Rust
        run: cargo +stable test --workspace --all-targets --all-features

      - name: Check MSRV
        run: cargo +1.85.0 check --workspace --all-targets --all-features

      - name: Check Rust documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --workspace --all-features --no-deps

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install VS Code extension dependencies
        run: npm --prefix editors/vscode ci

      - name: Test VS Code extension
        run: npm --prefix editors/vscode test

  native-platform:
    name: Native platform (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          components: clippy

      - name: Install MSRV Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.85.0

      - name: Lint workspace on native host
        run: cargo +stable clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test workspace on native host
        run: cargo +stable test --workspace --all-targets --all-features

      - name: Check workspace MSRV on native host
        run: cargo +1.85.0 check --workspace --all-targets --all-features

      - name: Check documentation on native host
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --workspace --all-features --no-deps

  windows-standard-user:
    name: Windows standard-user resolver
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable

      - name: Build resolver test binary
        shell: pwsh
        run: cargo +stable test -p gus-platform --lib --no-run

      - name: Run resolver as a non-Administrator
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $userName = "gusci"
          $plainPassword = "Gus-CI-$env:GITHUB_RUN_ID-Aa1!"
          $securePassword = ConvertTo-SecureString $plainPassword -AsPlainText -Force
          $credential = [pscredential]::new(".\$userName", $securePassword)
          $probeRoot = "C:\gus-standard-$env:GITHUB_RUN_ID"
          $probeTemp = Join-Path $probeRoot "temp"
          try {
            New-LocalUser -Name $userName -Password $securePassword -PasswordNeverExpires | Out-Null
            New-Item -ItemType Directory -Path $probeTemp -Force | Out-Null
            & icacls.exe $probeRoot /grant "${env:COMPUTERNAME}\${userName}:(OI)(CI)F" | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "failed to grant the standard-user probe directory"
            }

            $testBinary = Get-ChildItem "target\debug\deps\gus_platform-*.exe" |
              Sort-Object LastWriteTimeUtc -Descending |
              Select-Object -First 1
            if ($null -eq $testBinary) {
              throw "gus-platform test binary was not produced"
            }
            $copiedBinary = Join-Path $probeRoot "gus-platform-tests.exe"
            Copy-Item $testBinary.FullName $copiedBinary
            & icacls.exe $probeRoot /setowner "${env:COMPUTERNAME}\${userName}" /T /C | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "failed to assign the standard-user probe directory"
            }
            $stdout = Join-Path $probeRoot "stdout.txt"
            $stderr = Join-Path $probeRoot "stderr.txt"
            $arguments = "--exact real_git::resolver_windows::tests::native_standard_user_resolver_probe --nocapture --test-threads=1"
            $process = Start-Process `
              -FilePath $copiedBinary `
              -ArgumentList $arguments `
              -Credential $credential `
              -LoadUserProfile `
              -Environment @{
                GUS_WINDOWS_STANDARD_USER_TEST = "1"
                TEMP = $probeTemp
                TMP = $probeTemp
              } `
              -RedirectStandardOutput $stdout `
              -RedirectStandardError $stderr `
              -Wait `
              -PassThru
            Get-Content $stdout
            Get-Content $stderr
            if ($process.ExitCode -ne 0) {
              throw "standard-user resolver probe failed with exit code $($process.ExitCode)"
            }
          } finally {
            Remove-LocalUser -Name $userName -ErrorAction SilentlyContinue
          }

  freebsd-cross:
    name: FreeBSD ABI ${{ matrix.abi }} cross-check
    strategy:
      fail-fast: false
      matrix:
        abi:
          - "12"
          - "14"
          - "15"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUST_LIBC_UNSTABLE_FREEBSD_VERSION: ${{ matrix.abi }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          components: clippy
          targets: x86_64-unknown-freebsd

      - name: Install MSRV Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.85.0
          targets: x86_64-unknown-freebsd

      - name: Lint FreeBSD target
        run: cargo +stable clippy --target x86_64-unknown-freebsd -p gus-platform --all-targets --all-features -- -D warnings

      - name: Check FreeBSD target MSRV
        run: cargo +1.85.0 check --target x86_64-unknown-freebsd -p gus-platform --all-targets --all-features
