name: FreeBSD native release gate

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "17 19 * * 6"

permissions:
  contents: read

concurrency:
  group: freebsd-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-freebsd:
    name: FreeBSD ${{ matrix.release }} native
    strategy:
      fail-fast: false
      matrix:
        release:
          - "14.4"
          - "15.1"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run native FreeBSD quality gates
        uses: vmactions/freebsd-vm@77ed28d336d03fe19a3f4f7266c1d2c4714dd79d # v1.5.2
        with:
          release: ${{ matrix.release }}
          arch: x86_64
          usesh: true
          sync: rsync
          copyback: false
          prepare: |
            set -eu
            pkg install -y ca_root_nss curl git
            pw useradd gusci -m -s /bin/sh

            acl_md="$(mdconfig -a -t swap -s 256m)"
            newfs -U "/dev/${acl_md}"
            tunefs -a enable "/dev/${acl_md}"
            mkdir -p /gus-ci-tmp
            mount "/dev/${acl_md}" /gus-ci-tmp
            chown gusci:gusci /gus-ci-tmp
            chmod 700 /gus-ci-tmp

            rustup_url="https://static.rust-lang.org/rustup/dist/x86_64-unknown-freebsd/rustup-init"
            curl --fail --location --retry 5 --proto '=https' --tlsv1.2 \
              "${rustup_url}" -o /tmp/rustup-init
            curl --fail --location --retry 5 --proto '=https' --tlsv1.2 \
              "${rustup_url}.sha256" -o /tmp/rustup-init.sha256

            expected_rustup_sha="$(awk 'NR == 1 { print $1 }' /tmp/rustup-init.sha256)"
            actual_rustup_sha="$(sha256 -q /tmp/rustup-init)"
            test "${actual_rustup_sha}" = "${expected_rustup_sha}"

            install -o gusci -g gusci -m 700 /tmp/rustup-init /home/gusci/rustup-init
            su -l gusci -c '/home/gusci/rustup-init -y --no-modify-path --profile minimal --default-toolchain none'
            su -l gusci -c '/home/gusci/.cargo/bin/rustup toolchain install stable --profile minimal --component clippy --component rustfmt'
            su -l gusci -c '/home/gusci/.cargo/bin/rustup toolchain install 1.85.0 --profile minimal'
          run: |
            set -eu
            expected_release="${{ matrix.release }}"
            kernel_release="$(freebsd-version -k)"
            userland_release="$(freebsd-version -u)"
            case "${kernel_release}" in
              "${expected_release}"-*) ;;
              *)
                echo "unexpected kernel release: ${kernel_release}" >&2
                exit 1
                ;;
            esac
            case "${userland_release}" in
              "${expected_release}"-*) ;;
              *)
                echo "unexpected userland release: ${userland_release}" >&2
                exit 1
                ;;
            esac

            freebsd-version -ku
            uname -a
            sysctl kern.osreldate
            test "$(id -u)" -eq 0
            mount | grep 'on /gus-ci-tmp '

            workspace="$(pwd)"
            chown -R gusci:gusci "${workspace}"
            su -l gusci -c "
              set -eu
              cd '${workspace}'
              test \"\$(id -u)\" -ne 0
              export PATH='/home/gusci/.cargo/bin:/usr/local/bin:/usr/bin:/bin'
              export CARGO_TERM_COLOR=always
              export RUST_BACKTRACE=1
              export TMPDIR='/gus-ci-tmp'
              cargo +stable fmt --all -- --check
              cargo +stable clippy --workspace --all-targets --all-features -- -D warnings
              cargo +stable test --workspace --all-targets --all-features
              cargo +1.85.0 check --workspace --all-targets --all-features
              RUSTDOCFLAGS='-D warnings' cargo +stable doc --workspace --all-features --no-deps
            "
